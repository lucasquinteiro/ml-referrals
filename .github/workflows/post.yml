name: post

# Publish one tweet per run, hourly. `post` always sends exactly one, so the
# schedule is the rate limit: 24 tweets/day at this cadence.
#
# Reads whatever the daily ingest stored — it never scrapes. config.json's
# max_data_age_hours must stay above 24 or the later runs of the day will
# refuse to post on stale prices.
on:
  schedule:
    - cron: "0 * * * *"   # every hour, on the hour (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the tweet instead of posting it"
        type: boolean
        default: false

# Never let two runs post at once — they'd pick the same top offer.
concurrency:
  group: ml-referrals-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Chromium is needed to mint meli.la links through the link builder.
          python -m playwright install --with-deps chromium

      - name: Post
        env:
          # Affiliate identity + session. Without ML_AFFILIATE_STORAGE_STATE the
          # run still posts, falling back to matt_word/matt_tool links.
          ML_AFFILIATE_TAG: ${{ secrets.ML_AFFILIATE_TAG }}
          ML_AFFILIATE_TOOL_ID: ${{ secrets.ML_AFFILIATE_TOOL_ID }}
          ML_AFFILIATE_STORAGE_STATE: ${{ secrets.ML_AFFILIATE_STORAGE_STATE }}
          # X/Twitter cookie auth — same approach as the other pipelines.
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          # Optional: nicer copy. Templates are used when absent.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "Running: python run.py post $ARGS"
          python run.py post $ARGS
