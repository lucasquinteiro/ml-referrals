name: ingest

# Scrape MercadoLibre offers, snapshot prices, and post a summary to Slack.
# Once a day: the offer catalogue doesn't churn fast enough to justify more,
# and the price history only needs daily resolution to be useful.
#
# Requires config.json "store": "supabase" — a GitHub runner is ephemeral, so a
# SQLite file under state/ would be discarded after every run.
on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 08:00 in Buenos Aires
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages of /ofertas to crawl (blank = config.pages_per_run)"
        default: ""
      dry_run:
        description: "Scrape and match, but write nothing"
        type: boolean
        default: false

concurrency:
  group: ml-referrals-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # /ofertas is server-rendered, so scraping needs no browser. Chromium is
        # here only as the fallback transport for minting affiliate links, when
        # the plain-HTTP path isn't accepted.
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Minting links during ingest is what keeps the post job browser-free.
          ML_AFFILIATE_TAG: ${{ secrets.ML_AFFILIATE_TAG }}
          ML_AFFILIATE_TOOL_ID: ${{ secrets.ML_AFFILIATE_TOOL_ID }}
          ML_AFFILIATE_STORAGE_STATE: ${{ secrets.ML_AFFILIATE_STORAGE_STATE }}
          # No Mercado Libre session here on purpose: this scrapes /ofertas,
          # which is public. Search would need one, but a logged-in session on
          # a datacenter IP is exactly what gets an account flagged.
        run: |
          set -euo pipefail
          ARGS=""
          PAGES="${{ github.event.inputs.pages }}"
          if [ -n "$PAGES" ]; then ARGS="$ARGS --pages $PAGES"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "Running: python run.py ingest $ARGS"
          python run.py ingest $ARGS
