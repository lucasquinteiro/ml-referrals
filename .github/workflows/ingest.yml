name: ingest (manual)

# NOT SCHEDULED, deliberately.
#
# Everything that touches Mercado Libre — scraping, minting affiliate links,
# capturing offer cards — runs on your own machine, from your own IP, paced by
# `./run ingest`. Doing it from a GitHub runner means a datacenter IP hitting
# the site on a fixed schedule, which is what gets accounts and IPs flagged,
# and every failure there costs a re-login on an account you can't afford to
# keep re-authenticating.
#
# This workflow is kept for one-off manual runs (anonymous /ofertas only, no
# session, no link minting). The scheduled path is `post.yml`, which never
# touches Mercado Libre at all.
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages of /ofertas to crawl (blank = config.pages_per_run)"
        default: ""
      dry_run:
        description: "Scrape and match, but write nothing"
        type: boolean
        default: false

concurrency:
  group: ml-referrals-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # No browser: /ofertas is server-rendered, and this workflow never mints
        # links (--no-links below), so nothing here needs Chromium.
        run: pip install -r requirements.txt

      - name: Ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # No affiliate session on purpose — link minting is a local job.
          # No Mercado Libre session here on purpose: this scrapes /ofertas,
          # which is public. Search would need one, but a logged-in session on
          # a datacenter IP is exactly what gets an account flagged.
        run: |
          set -euo pipefail
          ARGS=""
          PAGES="${{ github.event.inputs.pages }}"
          if [ -n "$PAGES" ]; then ARGS="$ARGS --pages $PAGES"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "Running: python run.py ingest --no-links $ARGS"
          python run.py ingest --no-links $ARGS
